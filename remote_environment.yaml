    require_cuda: true
    cuda_runtime: "==11.8"
    minimum_disk_free_gb: 20
    hf_cache:
      required: true
      canonical_remote_path: /workspace/hf-cache
    upstream:
      neural_controllers_commit: 5f655a5f26daeb984dfe6c622b8fe537e1aed966
