    attention_backend: SDPA
    packages:
      torch:
        distribution: torch
        version: "==2.4.1+cu124"
        required: true
        evidence_level: exact_validated_remote
      transformers:
        distribution: transformers
        version: "==4.57.1"
        required: true
        evidence_level: exact_validated_remote
      accelerate:
        distribution: accelerate
        version: "==1.14.0"
        required: true
        evidence_level: exact_validated_remote
      huggingface_hub:
        distribution: huggingface-hub
        version: "==0.36.0"
        required: true
        evidence_level: exact_validated_remote
    require_cuda: true
    cuda_runtime: "==12.4"
    minimum_disk_free_gb: 20
    hf_cache:
      required: true
      canonical_remote_path: /workspace/hf-cache
    models:
      Qwen/Qwen3-8B:
        revision: b968826d9c46dd6066d109eabc6255188de91218
