schema_version: 1
evidence:
  repository_python: pyproject.toml requires Python >=3.11
  validated_remote: review/gate6_3_single_mean_semantic_evaluation/ENVIRONMENT_PROVENANCE.json records the exact Gate 6.3 CORE_QWEN environment
  hf_bounds: pyproject.toml records transformers >=4.45,<5 and accelerate >=0.33
