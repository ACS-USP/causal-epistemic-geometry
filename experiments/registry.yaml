      for the actual K-by-31 fresh-controller relational test, and what wholly
      prospective V2 design should replace them?
    instrument: >-
      100,000 normalized-Gaussian streams per audited candidate count,
      dependence-aware safety-selection sensitivity, and synthetic cross-block
      planning power; no controller stream or model output was generated.
    model_policy: NO_MODEL_INFERENCE
