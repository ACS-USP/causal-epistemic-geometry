    model_policy: Qwen3-8B full non-thinking generation, BF16, sampled
    status: COMPLETE_DEVELOPMENT_NO_SIGNAL
    outcome: MICRO_Q1_NO_DETECTABLE_SIGNAL
    scientific_interpretation: >-
      Direction validation and intervention-engineering checks passed. The
      meaningful plus and minus signs were valid and competence-preserving,
      but neither exceeded the frozen propensity-movement threshold beyond the
      norm-matched random control. This is a bounded development result, not a
      null theorem about Q1.
    source_commit: cf95566
    artifact: review/micro_q1/
    cost_usd: 0.10388888888888889
    holdout_status: UNTOUCHED
    audit:
      status: GATE4_AUDIT_MINOR_NONSCIENTIFIC_ISSUES
      artifact: review/micro_q1/forensic_audit/
      raw_rows: 400
      unique_logical_rows: 400
      duplicate_rows: 0
      missing_rows: 0
      seed_mismatches: 0
      formula_crosscheck: PASS
      scientific_result_changed: false
      provenance_corrections:
