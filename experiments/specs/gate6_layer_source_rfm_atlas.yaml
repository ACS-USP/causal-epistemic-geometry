schema_version: 1
experiment_id: GATE6_LAYER_SOURCE_RFM_ATLAS
status: FROZEN_PRE_OUTCOME
stage: DEVELOPMENT_LOCK
question: Do label-free, behaviorally validated source directions at pre-specified
  layers produce causal control of semantic error profiles when distributed with fixed
  standardized energy?
upstream:
  neural_controllers:
    repository: https://github.com/dmbeaglehole/neural_controllers.git
    branch: xrfm
    commit: 5f655a5f26daeb984dfe6c622b8fe537e1aed966
    requirements: Python 3.10.15; PyTorch 2.4.0+cu118; Transformers 4.47.0; Datasets
      3.1.0; NumPy 1.26.4; tqdm; torchmetrics; scikit-learn; xRFM.
  xrfm:
    repository: https://github.com/dmbeaglehole/xRFM.git
    commit: 773fae81097ab000e6e7292a295e1d24adacca55
  paper: arXiv:2502.03708
  adaptation: 'The official RFMToolkit call pattern is used for binary careful/direct
    source labels: pinned xRFM RFM.fit with get_agop_best_model=True, followed by
    the leading AGOP eigenvector. The repository''s multi-layer and current-token
    hook are execution adapters, not a replacement RFM.'
