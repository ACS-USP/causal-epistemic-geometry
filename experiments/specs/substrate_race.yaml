schema_version: 1
id: MODEL_POLICY_BENCHMARK_SUBSTRATE_RACE
version: GATE-3-INCREMENTAL
status: PROSPECTIVE_GATE3_INCREMENTAL
stage: EXPLORATION
question: >-
  Which frozen model-policy plus objective semantic-error instrument provides
  the cleanest development substrate for a later original micro-Q1?
experiment_source_commit: 125bf3c

models_policies:
  - id: QWEN_NONTHINKING
    model_id: Qwen/Qwen3-8B
    model_revision: b968826d9c46dd6066d109eabc6255188de91218
    prompt_mode: chat
    enable_thinking: false
  - id: LLAMA_INSTRUCT
    model_id: meta-llama/Llama-3.1-8B-Instruct
    model_revision: 0e9e39f249a16976918f6564b8830bc894c89659
    prompt_mode: chat
    enable_thinking: null

instruments:
  - id: FRESH_PSEUDOWORD_LONG
    source: procedural character-count generator
    n_common_items: 20
    seed_namespace: GATE3-SUBSTRATE-RACE-CHARCOUNT
    seed: 20260820
    evaluator: exact_integer
  - id: CRUXEVAL_SEMANTIC
    source: cruxeval-org/cruxeval
    split: test
    n_common_items: 20
    selection_namespace: GATE3-SUBSTRATE-RACE-CRUX-SELECTION
    selection_seed: 20260820
    evaluator: deterministic_type_aware_python_literal
    historical_ids: reconstructed_from_preserved_manifests_and_journals

frozen_common_manifests:
  character_count:
    path: review/substrate_race/CHARCOUNT_MANIFEST.json
    manifest_hash: 8d53205e7f1672925bb2820119703aa0d2b69a7485028dc240526ab2e8eedcfd
  cruxeval:
    path: review/substrate_race/CRUXEVAL_MANIFEST.json
    jsonl_path: review/substrate_race/CRUXEVAL_MANIFEST.jsonl
    manifest_hash: 95ed8ddb880d3e61d2582709acbc6c3ead554246dec245e5928663992fcf6145
    dataset_revision: b96af0450242eb4da433032b90998f25588a5d0f
    historical_excluded_count: 43

generation:
  max_new_tokens: 4096
  do_sample: true
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  dtype: bf16
  attention_implementation: sdpa
  seed_regime: INDEPENDENT_PRIMARY
  seed_derivation: experiment_id + model_policy_id + instrument_id + item_id + rollout_index
  no_behavioral_retries: true

stages:
  stage_1:
    items_per_cell: 5
    rollouts_per_item: 1
    purpose: technical_gate_only
    technical_pass:
      minimum_semantically_evaluable: 4
      failures_must_not_dominate: true
  stage_2:
    total_items_per_survivor: 20
    additional_items_after_stage_1: 15
    rollouts_per_item: 1
    eligible_for_resampling:
      minimum_valid_completion: 0.90
      minimum_correct: 2
      minimum_wrong: 2
      mechanical_failures_must_not_exceed_wrong: true
  stage_3:
    maximum_selected_cells: 2
    rollout_index: 1
    same_item_ids: true
    selection_ranking:
      - higher_valid_completion
      - larger_minimum_of_correct_and_wrong
      - lower_mechanical_failure_rate
      - lower_mean_generated_tokens
      - lexical_cell_id

limits:
  maximum_trajectories: 120
  target_incremental_gpu_cost_usd: 0.25
  hard_incremental_gpu_cost_usd: 0.50
  gpu_rate_usd_per_hour: 0.44

artifacts:
  output_directory: review/substrate_race/
  character_count_manifest: review/substrate_race/CHARCOUNT_MANIFEST.json
  cruxeval_manifest: review/substrate_race/CRUXEVAL_MANIFEST.json
  journal: review/substrate_race/journal.jsonl
  stage_2_results: review/substrate_race/CELL_RESULTS.csv
  stage_3_results: review/substrate_race/RESAMPLING_RESULTS.csv

firewall:
  baseline_only: true
  steering: forbidden
  activation_collection: forbidden
  pca: forbidden
  geometry: forbidden
  q2: forbidden
  holdout: forbidden
  livebench: forbidden
  dense_code: forbidden
  mmlu_pro: forbidden

selection_prohibitions:
  - closest_to_55_percent_as_sole_criterion
  - outcome_dependent_prompt_tuning
  - outcome_dependent_cap_changes
  - truncation_as_difficulty
  - historical_item_reuse
