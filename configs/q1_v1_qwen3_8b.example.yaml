# DEVELOPMENT PROTOCOL V1 TEMPLATE — replace only operational revision/hash
# placeholders before the first smoke; do not treat this as confirmatory.
experiment:
  name: q1-v1-qwen3-8b-development
  stage: development
  seed: 20260816

backend:
  type: huggingface
  model_id: Qwen/Qwen3-8B
  model_revision: RESOLVE_BEFORE_SMOKE
  tokenizer_id: Qwen/Qwen3-8B
  tokenizer_revision: RESOLVE_BEFORE_SMOKE
  hidden_size: 4096
  device: cuda
  device_map: null
  dtype: bf16
  layer: 17
  layer_path: model.model.layers
  prompt_mode: chat
  enable_thinking: false
  inference_mode: choice_loglikelihood
  candidate_labels: [A, B, C, D, E, F, G, H, I, J]
  max_new_tokens: 1
  do_sample: false
  batch_size: 1
  quantization: none

benchmark:
  type: mmlu_pro
  dataset_id: TIGER-Lab/MMLU-Pro
  dataset_revision: RESOLVE_BEFORE_SMOKE
  split: validation
  max_items: 8
  allowed_targets: [A, B, C, D, E, F, G, H, I, J]

steering:
  enabled: true
  layer: 17
  alpha: 0.0
  token_scope: last_token
  constructor: zero_vector
  vector_dimension: 4096

output:
  root: runs/q1_v1
  save_figures: true
