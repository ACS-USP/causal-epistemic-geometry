# TECHNICAL DEVELOPMENT TEMPLATE. Do not treat this as a scientific result.
experiment:
  name: q1-technical-smoke-REPLACE_ME
  stage: development
  seed: 123

backend:
  type: huggingface
  model_id: REPLACE_ME
  model_revision: REPLACE_ME
  tokenizer_id: REPLACE_ME
  tokenizer_revision: REPLACE_ME
  device: auto
  device_map: auto
  dtype: auto
  layer: 0  # REPLACE_ME after architecture review
  layer_path: REPLACE_ME
  prompt_mode: chat
  max_new_tokens: 4
  do_sample: false
  batch_size: 1
  inference_mode: choice_loglikelihood
  execution_mode: cached_decode
  candidate_head_mode: full_vocab_reference
  item_batch_size: 1
  condition_chunk_size: 1
  max_prefill_tokens: 8192
  padding_side: left
  attention_implementation: auto
  torch_compile: false
  cuda_graphs: false

benchmark:
  type: jsonl
  path: examples/technical_smoke_mcq.jsonl
  max_items: 8
  allowed_targets: [A, B, C, D]

steering:
  enabled: true
  layer: 0  # REPLACE_ME after architecture review
  alpha: 0.0  # REPLACE_ME after development review
  token_scope: last_token
  vector_path: REPLACE_ME
  constructor: loaded_vector

output:
  root: runs
  save_figures: false
