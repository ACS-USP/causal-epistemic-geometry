# Q1 DEVELOPMENT V1.1 — frozen controlled follow-up.
# Real execution is RunPod-only. This config never authorizes the holdout.
experiment:
  name: q1-v1-1-qwen3-8b-development
  stage: development
  seed: 20260816

backend:
  type: huggingface
  model_id: Qwen/Qwen3-8B
  model_revision: b968826d9c46dd6066d109eabc6255188de91218
  tokenizer_id: Qwen/Qwen3-8B
  tokenizer_revision: b968826d9c46dd6066d109eabc6255188de91218
  hidden_size: 4096
  device: cuda
  device_map: null
  dtype: bf16
  layer: 17
  layer_path: model.model.layers
  prompt_mode: chat
  enable_thinking: false
  inference_mode: choice_loglikelihood
  candidate_labels: [A, B, C, D, E, F, G, H, I, J]
  max_new_tokens: 1
  do_sample: false
  batch_size: 1
  quantization: none
  execution_mode: cached_decode
  candidate_head_mode: full_vocab_reference
  item_batch_size: 4
  condition_chunk_size: 3
  max_prefill_tokens: 8192
  padding_side: left
  attention_implementation: auto
  torch_compile: false
  cuda_graphs: false
  serial_shape_reference: true

benchmark:
  type: mmlu_pro
  dataset_id: TIGER-Lab/MMLU-Pro
  dataset_revision: b189ec765aa7ed75c8acfea42df31fdae71f97be
  split: dev_evaluation
  split_manifest: data/splits/mmlu_pro_q1_v1.json
  allowed_targets: [A, B, C, D, E, F, G, H, I, J]

steering:
  enabled: true
  layer: 17
  alpha: 0.0
  token_scope: last_token
  constructor: loaded_v1_artifact
  vector_dimension: 4096

output:
  root: runs/q1_v1_1
  save_figures: true

q1_v1_1:
  protocol: Q1_DEVELOPMENT_PROTOCOL_V1_1
  v1_run_dir: runs/q1_v1/20260816T172847Z_q1-v1-development_ac2f36265c
  permutation_seed: 20260816
  permutation_ids: [permutation_0, permutation_1, permutation_2, permutation_3]
  repeat_items: 16
  bootstrap_resamples: 200
  a40_hourly_usd_assumption: 0.40
  observed_v1_scoring_minutes: 80.85
