[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-epistemic-geometry"
version = "0.1.0"
description = "Development harness for causal activation interventions and error complementarity."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Causal Epistemic Geometry research team"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "typer>=0.9",
  "rich>=13.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
]
hf = [
  # The RunPod bootstrap intentionally preserves an existing CUDA Torch build.
  # Transformers 5.x requires Torch >=2.5, while common CUDA images still ship
  # Torch 2.4.x; keep the optional stack compatible with both.
  "transformers>=4.45,<5",
  "accelerate>=0.33",
]

[project.scripts]
ceg = "epistemic_geometry.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
