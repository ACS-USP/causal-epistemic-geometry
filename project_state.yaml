    status: ACCEPTED_EXPLORATION
    conclusion: >-
      Original outputs are preserved. Deterministic semantic reanalysis gives
      character-count 20/20 valid, 15 correct, 5 genuine wrong, 75%,
      PROMISING; CRUXEval 20/20 valid, 8 correct, 12 wrong, 40%, PROMISING.
      No steering occurred; this is still an exploration instrument result.
  - id: MODEL_POLICY_BENCHMARK_SUBSTRATE_RACE
    status: COMPLETE_EXPLORATION
    conclusion: >-
      The baseline-only Gate 3 race recommends Qwen3-8B full non-thinking with
      CRUXEval semantic as the primary development substrate and fresh long
      character count as backup. Llama-Instruct cells failed eligibility due to
      completion/mechanical failures. No steering or geometry was run.
  - id: FIRST_MICRO_Q1
    status: COMPLETE_DEVELOPMENT_NO_SIGNAL
    conclusion: >-
      Gate 4 direction validation and intervention engineering passed, but the
      frozen one-shot direction did not exceed baseline resampling and the
      norm-matched random control. This remains a bounded development result.
  - id: GATE5_SOURCE_DURATION_BRIDGE
    status: COMPLETE_DEVELOPMENT_DURATION_EFFECT_BELOW_MOVEMENT
    conclusion: >-
      The careful/direct textual source passed behavioral separation and the
      sustained manipulation gate passed. The 60-item primary evaluation did
      not meet the frozen movement threshold; the minus sign showed a duration
      contrast below the full movement criterion. Gate 6 is drafted only.
  - id: GATE6_SOURCE_ATTRITION_REPAIR
    status: COMPLETE_SOURCE_SCREEN
    conclusion: >-
      The frozen mechanical repair reached the 104/32 source targets within
      attrition limits and constructed the source/controller atlas. Several
      label-free readouts were strong, but no individual RFM controller passed
      the frozen symmetric first-stage gate. Manipulation and evaluation were
      not run; principal review is required before any redesign.
  - id: GATE6_2_FIRST_STAGE_REPAIR_MEAN_BRIDGE
    status: COMPLETE_DEVELOPMENT_NO_FIRST_STAGE
    conclusion: >-
      Gate 6.2 source-only repair completed and selected paired-mean prompt
      L27/L22-L27-L32 controllers. In the complete 20-item matched
      manipulation gate, the plus controllers produced large changes but
      failed validity, while the minus controller passed validity but did not
      exceed the random-mean change null. The 60-item evaluation was not run.
  - id: GATE6_3_SINGLE_MEAN_SEMANTIC_EVALUATION
    status: COMPLETE_DEVELOPMENT_DESTRUCTIVE
    conclusion: >-
      Gate 6.2 raw outputs were preserved and reanalyzed offline with the
      external-semantic-v2 parser. The matched four-vector single-L27 random
      gate passed and the complete 840-row evaluation ran exactly as frozen.
      BEST_SINGLE_MEAN_PLUS exceeded the random mean and maximum on point
      estimates of G/C/D and preserved accuracy tolerance, but validity was
      0.9083 versus the required 0.9250 guard. The frozen classification is
      GATE6_3_SINGLE_MEAN_DESTRUCTIVE. No Q2, character-count replication, or
      holdout access occurred.
  - id: GATE6_3_SEMANTIC_VALIDITY_AUDIT
    status: COMPLETE_OFFLINE_DIAGNOSTIC_STRONG_SIGNAL
    conclusion: >-
      The immutable 920 Gate 6.3 outputs were reanalyzed condition-symmetrically
      with external-semantic-v3 after parser rules were frozen on a masked
      corpus. Controller commitment validity/evaluability rose to 0.9750 and
      the diagnostic G/C/D signal exceeded all four random controls. The
      additive classification is GATE6_3_V3_STRONG_SPECIFIC_CONTROL_SIGNAL;
      the historical Gate 6.3 classification remains destructive and no new
      inference occurred.
  - id: GATE7_FRESH_SINGLE_L27_REPLICATION
    status: COMPLETE_DEVELOPMENT_DESTRUCTIVE
    conclusion: >-
      On 120 fresh CRUXEval items, the frozen L27 controller produced large,
      random-null-specific G/C/D and a 14.58-point accuracy gain, but reduced
      commitment validity and semantic evaluability from 99.17% to 90.00% and
      therefore failed the frozen relative guard. The independent audit was
      clean. This is a destructive development result, not confirmation.
  - id: GATE8_L27_DOSE_CALIBRATION
    status: COMPLETE_DEVELOPMENT_CALIBRATION
    conclusion: >-
      The complete 2,200-row matched calibration selected D75 as the lowest
      eligible lower dose. D75 preserved 100% commitment validity and semantic
      evaluability, exceeded the dose-matched random bank on semantic change,
      and recovered 34.6% of the CAREFUL token increase. The forensic audit was
      clean. Gate 9, G/C/D evaluation, Q2, character count, and holdout access
      were not run.
  - id: GATE9_SELECTED_D75_EVALUATION
    status: COMPLETE_DEVELOPMENT_STRONG_SAFE_REPLICATION
    conclusion: >-
      On 100 fresh CRUXEval items, the exact Gate-8-selected D75 controller
      raised accuracy from 47% to 60% while preserving commitment validity and
      semantic evaluability at 97%. G=0.1325, C=0.0643, and D=0.1200 exceeded
      every one of four new random controls; rescue was 0.1525 versus damage
      0.0225. The frozen classification is a strong safe DEVELOPMENT
      replication. Independent metric recomputation agreed exactly; the
      forensic classification records one minor non-scientific parser-totality
      incident. At Gate-9 closeout, Gate 10 was drafted only; Q2 and holdout
      remained closed.
  - id: GATE10_CROSS_DOMAIN_CHARCOUNT
    status: COMPLETE_DEVELOPMENT_NO_TRANSFER
    conclusion: >-
      On 200 fresh FRESH_PSEUDOWORD_LONG items, baseline opportunity passed
      with accuracy 0.8625 and B00=0.045. The exact CRUXEval-derived L27-D75
      controller was safe but did not transfer specific error control:
      G=-0.01625, C=-0.01230, D=-0.025, with rescue below damage and all three
      estimands below the random-controller mean. The textual careful source
      also did not replicate under its frozen rule. The independent forensic
      audit was clean. Gate 11 is drafted only; Q2 and holdout remain closed.
