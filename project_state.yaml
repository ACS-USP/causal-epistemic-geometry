project:
  name: Causal Geometry of Epistemic Complementarity
  repository: ACS-USP/causal-epistemic-geometry
  scientific_stage: DEVELOPMENT
  claim_status: NONE_FROZEN
  long_term_question: >-
    Can internal representation and intervention geometry predict and causally
    control which blind spots competence-preserving model variants exhibit?
  minimal_q1: >-
    Can one controlled activation intervention change where a frozen model
    fails beyond ordinary stochastic resampling without merely making it worse?
  q2: >-
    Does geometry between interventions predict geometry between semantic
    error profiles?
  q3: >-
    Can a realizable committee exploit measured complementarity for collective
    utility?

