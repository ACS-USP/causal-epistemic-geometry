schema_version: 1
last_verified: "2026-08-19"
project:
  name: Causal Geometry of Epistemic Complementarity
  repository: ACS-USP/causal-epistemic-geometry
  scientific_stage: DEVELOPMENT
  claim_status: NONE_FROZEN
  long_term_question: >-
    Can internal representation and intervention geometry predict and causally
    control which blind spots competence-preserving model variants exhibit?
  minimal_q1: >-
    Can one controlled activation intervention change where a frozen model
    fails beyond ordinary stochastic resampling without merely making it worse?
  q2: >-
    Does geometry between interventions predict geometry between semantic
    error profiles?
  q3: >-
    Can a realizable committee exploit measured complementarity for collective
    utility?

current:
  workstream: FULL_NONTHINKING_SMOKE
  source_commit: 2d03624ebc594f504a0f19c6104c8c8909fd5de1
  summary: >-
    Gate 1 is prospectively frozen for a bounded full non-thinking smoke on
    fresh long character-count and fresh CRUXEval semantic items. Only this
    exploration gate is authorized; outcomes must be reviewed before any
    positive control or causal work.
  next_authorized_action: >-
    Execute only the staged Gate 1 smoke after the pre-outcome source commit;
    then stop the Pod and return the compact review artifact to the principal.
  runpod: STOPPED
  gpu_work_authorized: true
  new_scientific_experiment_authorized: true

scientific_firewall:
  steering: NOT_RUN_SCIENTIFICALLY
  geometry_q2: NOT_RUN
  committee_q3: NOT_RUN
  confirmatory_holdout: UNTOUCHED
  model_downloads_local: FORBIDDEN
  current_task: FULL_NONTHINKING_SMOKE_GATE_1

instrument_history:
  - id: Q1_V1_SERIES
    status: CLOSED_DEVELOPMENT
    conclusion: >-
      MMLU-Pro multiple-choice outcomes were estimator-sensitive; no robust
      semantic-complementarity claim was frozen.
  - id: Q1_V2_E3_10
    status: CLOSED_NOT_QUALIFIED
    conclusion: >-
      The non-thinking first-response candidate-logit readout was chance-like
      and output-channel unstable; it remains a direct-readout ablation.
  - id: Q1_V3_REASONING_AGENT
    status: CLOSED_SCREEN_FAILED
    conclusion: >-
      Stage A completed baseline-only with zero qualifying families. Apparent
      intermediate performance was dominated by completion and truncation.
  - id: EXTERNAL_BENCHMARK_SEARCH
    status: CLOSED_DEVELOPMENT
    conclusion: >-
      CRUXEval low-cap records were reclassified; generous-cap diagnostics
      exposed saturation and format sensitivity. No steering was run.
  - id: Q1_V4_MICROBENCH
    status: CLOSED_DEVELOPMENT
    conclusion: >-
      Character counting saturated semantically and exposed parser artifacts.
      A tiny weekday activation association is descriptive only and is being
      statistically reanalyzed for tied-rank correctness.
  - id: Q1_V4_DENSE_CODE
    status: PAUSED_INFRASTRUCTURE
    conclusion: >-
      Nested per-test outcomes are instrument-promising, but safe objective
      execution is not production-ready. No model pilot was run.
  - id: FULL_NONTHINKING_SMOKE
    status: IN_PROGRESS
    conclusion: >-
      Prospective Gate 1 exploration: full autoregressive Qwen generation with
      thinking disabled on fresh long character-count and fresh CRUXEval items;
      classification and outcomes are not yet recorded.

workflow_regimes:
  EXPLORATION:
    purpose: Cheap signal discovery and instrument rejection.
    typical_scale: 5-20 items
    requirements:
      - exact or audited outcome labels
      - explicit cost ceiling
      - preserved raw outcomes
      - no confirmatory language
  DEVELOPMENT_LOCK:
    purpose: Freeze a promising instrument before causal evaluation.
    requirements:
      - versioned protocol and schema
      - cost projection and synthetic statistical validation
      - immutable model, policy, prompts, seeds, parser, and estimands
      - principal review
  CONFIRMATORY:
    purpose: Execute a sealed hypothesis test without adaptive choices.
    requirements:
      - sealed estimands and holdout
      - exact source commit and validator
      - no outcome-dependent tuning

