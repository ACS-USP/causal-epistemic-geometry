workflow_regimes:
  EXPLORATION:
    purpose: Cheap signal discovery and instrument rejection.
    typical_scale: 5-20 items
    requirements:
      - exact or audited outcome labels
      - explicit cost ceiling
      - preserved raw outcomes
      - no confirmatory language
  DEVELOPMENT_LOCK:
    purpose: Freeze a promising instrument before causal evaluation.
    requirements:
      - versioned protocol and schema
      - cost projection and synthetic statistical validation
      - immutable model, policy, prompts, seeds, parser, and estimands
      - principal review
  CONFIRMATORY:
    purpose: Execute a sealed hypothesis test without adaptive choices.
    requirements:
      - sealed estimands and holdout
      - exact source commit and validator
      - no outcome-dependent tuning

